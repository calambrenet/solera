# Solera: garantiza el usuario gdm independientemente de lo que el paquete
# gdm upstream declare.
#
# En el snapshot ALA 2026/05/23 el /usr/lib/sysusers.d/gdm.conf que ship
# el paquete gdm solo declaraba el grupo (`g gdm 120 -`), faltando la
# línea `u gdm 120 "..." /var/lib/gdm`. Resultado: getent passwd gdm
# quedaba vacío y el greeter de GDM corría bajo un UID efímero asignado
# por nss-systemd (típicamente 60578), con efecto colateral de un
# user@<UID>.service que al cierre podía esperar hasta 2 min
# (TimeoutStopSec=120s upstream).
#
# Este archivo NO duplica el grupo (lo sigue declarando el paquete gdm).
# `m gdm video` mete al usuario en el grupo video, necesario para DRM
# en sesiones gráficas.

u gdm 120:120 "GNOME Display Manager" /var/lib/gdm /usr/bin/nologin
m gdm video
