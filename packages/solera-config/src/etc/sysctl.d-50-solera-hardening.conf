# Solera hardening — separado de 99-solera.conf (tuning general) para que
# los cambios de postura de seguridad queden aislados y revisables aparte.
# Ver docs/security-hardening.md para el razonamiento de cada valor.

# Oculta punteros del kernel a usuarios sin privilegios (dificulta saltarse
# KASLR al construir un exploit local).
kernel.kptr_restrict = 2

# dmesg solo para CAP_SYSLOG.
kernel.dmesg_restrict = 1

# kexec_load también permite cargar un kernel arbitrario en caliente;
# sin caso de uso en un escritorio con systemd-boot + arkdep.
kernel.kexec_load_disabled = 1

# 2, no 3: bloquea la mayoría de eventos de kernel/CPU sin privilegios pero
# deja `perf` utilizable sin sudo — Solera también es plataforma de
# desarrollo (git, toolchains vienen en la imagen base).
kernel.perf_event_paranoid = 2

# Anti-spoofing y no confiar en redirects ICMP no solicitados.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
