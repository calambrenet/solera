# Solera Plymouth defaults.
#
# Theme=solera es el tema propio de Solera: una copia del 'spinner' de Arch
# con el watermark sustituido por el logo de Solera (mismo SVG que usa GDM).
# Se construye en el package() de solera-config y se instala en
# /usr/share/plymouth/themes/solera/.

[Daemon]
Theme=solera
ShowDelay=0
