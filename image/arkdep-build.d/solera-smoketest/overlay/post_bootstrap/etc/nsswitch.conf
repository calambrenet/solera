# /etc/nsswitch.conf — Solera (smoketest)
# Los usuarios "del sistema" viven en /usr/lib/{passwd,group,shadow} (ro)
# y los locales en /etc/{passwd,group,shadow} (overlay rw). extrausers los
# une. Idéntico a la imagen real.
passwd: files systemd extrausers
group:  files [SUCCESS=merge] systemd extrausers
shadow: files systemd extrausers
gshadow: files systemd

publickey: files

hosts: mymachines resolve [!UNAVAIL=return] files myhostname dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

netgroup: files
