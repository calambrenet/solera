<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Solera icon (square variant) — solo el sol, sin texto.
     Pensado para iconos de aplicación en grids cuadrados (hicolor
     scalable/apps/). El banner con texto vive en solera-logo.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <g transform="translate(60, 60)" fill="#F5C84A">
    <!-- Anillo central -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#F5C84A" stroke-width="9"/>
    <!-- 12 rayos como puntos a 30° de intervalo, radio 50 desde centro -->
    <circle cx="0"   cy="-50" r="5"/>
    <circle cx="25"  cy="-43" r="5"/>
    <circle cx="43"  cy="-25" r="5"/>
    <circle cx="50"  cy="0"   r="5"/>
    <circle cx="43"  cy="25"  r="5"/>
    <circle cx="25"  cy="43"  r="5"/>
    <circle cx="0"   cy="50"  r="5"/>
    <circle cx="-25" cy="43"  r="5"/>
    <circle cx="-43" cy="25"  r="5"/>
    <circle cx="-50" cy="0"   r="5"/>
    <circle cx="-43" cy="-25" r="5"/>
    <circle cx="-25" cy="-43" r="5"/>
  </g>
</svg>
