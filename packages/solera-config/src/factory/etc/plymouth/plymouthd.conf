# Solera Plymouth defaults.
#
# Theme=spinner es el tema built-in mínimo (sin logo OEM como bgrt
# requiere). Para branding completo de Solera (logo ámbar, animación
# propia) crear un paquete `solera-plymouth-theme` separado y cambiar
# Theme aquí o vía `plymouth-set-default-theme solera`.

[Daemon]
Theme=spinner
ShowDelay=0
