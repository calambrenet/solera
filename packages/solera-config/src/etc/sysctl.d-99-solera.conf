# Solera defaults — defaults sensatos no intrusivos.

# Permitir mapeo unprivileged de namespaces (necesario para podman/distrobox
# rootless). Es la posición que toman Bluefin/Silverblue.
kernel.unprivileged_userns_clone = 1

# Algo menos de swappiness para sobremesa/portátil con SSD/NVMe.
vm.swappiness = 10
