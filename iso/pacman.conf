#
# /etc/pacman.conf — usado por mkarchiso para construir el live de Solera.
#
# A diferencia de la receta arkdep (que se ancla al Arch Linux Archive), aquí
# usamos los mirrors normales del host de build: la ISO es un medio
# instalador, no la imagen del sistema. El instalador despliega la imagen
# real (anclada) desde el repo de Solera. La ISO solo necesita ser capaz de
# arrancar y llamar a `arkdep deploy`.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist

# Repositorio propio de Solera (S3+CloudFront). Hace falta para que
# packages.x86_64 pueda resolver solera-keyring, arkdep, y
# os-installer-config-solera. La URL real se inyecta por CI vía sed o
# variable de entorno; por defecto deja un placeholder que falla rápido si
# alguien intenta construir sin configurarla.
[solera]
SigLevel = Optional TrustAll
Server = file:///var/cache/pacman/pkg/solera-localrepo/x86_64
