# Solera: timeout de stop más razonable que el default (90s).
#
# Bajo el default systemd, apagar arrastra varios servicios que ignoran
# SIGTERM:
#   - user@<UID>.service de gnome-initial-setup (UID dinámico ~60000+)
#     no termina tras crear el primer usuario.
#   - malcontent-timer.service (Parental Controls Timer Daemon) ignora
#     SIGTERM en algunos escenarios (bug upstream conocido).
#
# 15s es agresivo pero deja margen para que servicios bien comportados
# limpien recursos antes del SIGKILL.
#
# El valor previo de 5s era demasiado corto: podía dejar el ESP en
# estado "dirty" (FAT32 sin flush), forzando fsck.vfat al siguiente
# boot y empeorando el timing de aparición del ESP. 15s da espacio
# para flush limpio sin alargar shutdown notablemente.

[Manager]
DefaultTimeoutStopSec=15s
