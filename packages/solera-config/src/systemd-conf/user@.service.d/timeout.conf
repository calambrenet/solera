# Solera: cap del TimeoutStopSec del user manager genérico.
#
# El default upstream de user@.service es TimeoutStopSec=120s, que
# sobrescribe el DefaultTimeoutStopSec global del systemd manager.
# Aunque solera-gdm.conf arregla la causa raíz (greeter de GDM
# corriendo bajo UID efímero por falta de usuario gdm), cualquier
# user@<UID>.service que se cuelgue al apagar haría esperar 2 min.
#
# 15s da margen a sesiones bien comportadas y mata las atascadas.
#
# TimeoutStopFailureStatus=success: sin esto, el kill por timeout deja el
# user@<uid> en estado 'failed' (result 'timeout'). Desde systemd 256,
# systemd-boot-check-no-failures (solera-bootcheck) cuenta CUALQUIER unidad
# failed como arranque malo, y el SIGKILL a una sesión que no murió limpiamente
# (p. ej. la de gnome-initial-setup al cerrarse tras crear el usuario) le
# costaría a la entrada de systemd-boot un intento del boot counting,
# pudiendo forzar un rollback injustificado. El kill rápido se mantiene;
# solo deja de contar como fallo.
[Service]
TimeoutStopSec=15s
TimeoutStopFailureStatus=success
